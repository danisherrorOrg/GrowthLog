<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Strict CSP: no inline scripts or eval (the build script sets INLINE_RUNTIME_CHUNK=false
      so the build has no inline scripts), and network calls only to this origin and the API.
      %REACT_APP_API_URL% is filled in at build time from the same variable the API client
      uses; localhost:8000 and ws://localhost:3000 are for local development.
    -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data: https:;
      connect-src 'self' %REACT_APP_API_URL% http://localhost:8000 ws://localhost:3000;
      object-src 'none';
      base-uri 'self';
      form-action 'self';
    " />
    <title>GrowthLog — Personal Growth Journal</title>
    <meta name="description" content="Record who you are today. Manifest who you want to become." />
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
