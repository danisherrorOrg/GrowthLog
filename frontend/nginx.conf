server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: unknown paths (e.g. /todos on refresh) serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets never change, so cache them hard; index.html is never cached
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
